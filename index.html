<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>QuickNotes</h1>
      <p>Your simple online notes manager</p>
    </header>

    <section class="notes-section">
      <h2>Your Notes</h2>

      <button id="load-btn" type="button">Load notes</button>

      <p id="status" role="status" aria-live="polite">
        Click "Load notes" to get started.
      </p>

      <form id="note-form">
        <h2>Create a Note</h2>

        <label for="title-input">Note title</label>
        <input
          type="text"
          id="title-input"
          maxlength="100"
          required
        >

        <label for="body-input">Note body (optional)</label>
        <textarea id="body-input" rows="4"></textarea>

        <button id="submit-btn" type="submit">Create note</button>
      </form>

      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
